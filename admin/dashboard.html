
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eLOLA - Dashboard Eksekutif</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container container-wide">
    <header>
      <div>
        <h3>Dashboard Admin & DLH</h3>
        <p style="color:var(--abu); font-size:12px;">Pemantauan Kepatuhan ASN & Rekap Sampah Kota</p>
      </div>
      <div>
        <a href="/peringkat.html" style="font-weight:600; text-decoration:none; margin-right:12px; color:var(--hijau-tua);">🏆 Papan RT</a>
        <button id="btnLogout" class="btn-secondary" style="width:auto; padding:6px 12px; font-size:12px;">Keluar</button>
      </div>
    </header>

    <div class="grid-stats">
      <div class="stat-box">
        <div class="stat-num" id="kpiTotalAsn">0</div>
        <div class="stat-label">Total ASN Terdaftar</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="kpiKepatuhan">0%</div>
        <div class="stat-label">% Kepatuhan (≥2kg)</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="kpiVolumeKg">0</div>
        <div class="stat-label">Total Sampah (kg)</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="kpiPoin">0</div>
        <div class="stat-label">Poin Beredar</div>
      </div>
    </div>

    <div class="card">
      <h3>Daftar Kepatuhan Setoran ASN (≥ 2 kg)</h3>
      <table>
        <thead>
          <tr>
            <th>Nama ASN</th>
            <th>NIP / NIK</th>
            <th>Kelurahan / RT</th>
            <th>Total Setor</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="asnTableBody">
          <tr><td colspan="5">Memuat data ASN...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { sb, periksaSesi, keluarSesi } from '/js/supabase.js';

    const $ = (id) => document.getElementById(id);
    const auth = await periksaSesi(['admin']);
    if (!auth) throw new Error("Akses admin diperlukan");

    $('btnLogout').onclick = keluarSesi;

    async function muatStatistik() {
      const { data: users } = await sb.from('users').select('*');
      const asns = (users || []).filter(u => u.is_asn || u.peran === 'asn');
      const patuhCount = asns.filter(u => (parseFloat(u.total_kg) || 0) >= 2.0).length;

      const totalKg = (users || []).reduce((acc, u) => acc + (parseFloat(u.total_kg) || 0), 0);
      const totalPoin = (users || []).reduce((acc, u) => acc + (u.saldo_poin || 0), 0);

      $('kpiTotalAsn').textContent = asns.length;
      $('kpiKepatuhan').textContent = asns.length ? `${Math.round((patuhCount / asns.length) * 100)}%` : '0%';
      $('kpiVolumeKg').textContent = totalKg.toFixed(1);
      $('kpiPoin').textContent = totalPoin.toLocaleString('id-ID');

      const tbody = $('asnTableBody');
      if (asns.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:var(--abu);">Belum ada ASN terdaftar.</td></tr>';
        return;
      }

      tbody.innerHTML = asns.map(a => {
        const kg = parseFloat(a.total_kg) || 0;
        const statusPatuh = kg >= 2.0;
        return `
          <tr>
            <td><strong>${a.nama}</strong></td>
            <td>${a.nik_nip || '-'}</td>
            <td>${a.kelurahan || '-'} • ${a.rt || '-'}</td>
            <td>${kg.toFixed(1)} kg</td>
            <td><span class="badge ${statusPatuh ? 'badge-terverifikasi' : 'badge-menunggu'}">${statusPatuh ? 'Patuh' : 'Belum'}</span></td>
          </tr>
        `;
      }).join('');
    }

    muatStatistik();
  </script>
</body>
</html>
