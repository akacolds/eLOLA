<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eLOLA – Klasemen RT</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;600;700&display=swap">

<body>
  <main class="kartu lebar">
    <section class="kiri">
      <div class="logo">
        <svg viewBox="0 0 42 42">
          <rect width="42" height="42" rx="11" fill="#58b45d"/>
          <path d="M21 9c-6 5-8 10-8 14a8 8 0 0 0 16 0c0-4-2-9-8-14z" fill="#fff"/>

      <div>

      </div>
    </section>
    <section class="kanan">

          <p>Terhitung dari akumulasi setoran sampah terverifikasi.</p>
        </div>
        <a href="/index.html" class="tombol-kecil rank-back">← Kembali</a>
      </div>

      <div style="margin-top:24px">

        <div class="rank-daftar" id="daftarRank"></div>
      </div>
