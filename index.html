<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eLOLA – Masuk & Daftar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="kartu">
    <section class="kiri">
      <div class="logo">
        <svg viewBox="0 0 42 42">
          <rect width="42" height="42" rx="11" fill="#58b45d"/>
          <path d="M21 9c-6 5-8 10-8 14a8 8 0 0 0 16 0c0-4-2-9-8-14z" fill="#fff"/>
          <path d="M21 14v17" stroke="#58b45d" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div><b>eLOLA</b><small>Bank Sampah Digital</small></div>
      </div>
      <div>
        <h2>Tabungan sampah versi digital warga Wundumbatu.</h2>
        <p>Setiap setoran ditimbang, diverifikasi, dan dikonversi menjadi poin reward.</p>
      </div>
      <div style="font-size:.8rem;color:#cfe3d0">Kelurahan Wundumbatu, Kendari</div>
    </section>

    <section class="kanan">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
        <button type="button" id="pWarga" class="tombol-kecil utama">Warga</button>
        <button type="button" id="pAsn" class="tombol-kecil">ASN</button>
        <button type="button" id="pPetugas" class="tombol-kecil">Petugas</button>
      </div>

      <div class="tab">
        <button type="button" id="tMasuk" class="aktif">Masuk</button>
        <button type="button" id="tDaftar">Daftar Akun</button>
      </div>

      <div id="notif" class="notif hidden"></div>

      <form id="fMasuk">
        <label for="idMasuk" id="lblIdMasuk">Email (Gmail)</label>
        <input id="idMasuk" type="text" required placeholder="nama@gmail.com">
        <label for="sMasuk">Kata Sandi</label>
        <input id="sMasuk" type="password" required placeholder="••••••••">
        <button class="tombol" type="submit" style="margin-top:18px">Masuk ke eLOLA →</button>
      </form>

      <form id="fDaftar" class="hidden">
        <label for="nama">Nama Lengkap</label>
        <input id="nama" type="text" required>
        <div id="blokAsn" class="hidden">
          <label for="nikNip">NIP / NIK</label>
          <input id="nikNip" type="text">
        </div>
        <label for="rw">RW</label>
        <select id="rw" required>
          <option value="">Pilih RW</option>
          <option>RW 01</option><option>RW 02</option><option>RW 03</option><option>RW 04</option><option>RW 05</option><option>RW 06</option><option>RW 07</option>
        </select>
        <label for="rt">RT</label>
        <select id="rt" required>
          <option value="">Pilih RT</option>
          <option>RT 01</option><option>RT 02</option><option>RT 03</option><option>RT 04</option><option>RT 05</option><option>RT 06</option><option>RT 07</option><option>RT 08</option><option>RT 09</option><option>RT 10</option><option>RT 11</option><option>RT 12</option><option>RT 13</option><option>RT 14</option><option>RT 15</option><option>RT 16</option><option>RT 17</option><option>RT 18</option><option>RT 19</option><option>RT 20</option><option>RT 21</option><option>RT 22</option><option>RT 23</option><option>RT 24</option><option>RT 25</option><option>RT 26</option><option>RT 27</option><option>RT 28</option><option>RT 29</option>
        </select>
        <label for="emailDaftar">Gmail</label>
        <input id="emailDaftar" type="email" required placeholder="nama@gmail.com">
        <label for="sDaftar">Kata Sandi (min. 6 karakter)</label>
        <input id="sDaftar" type="password" required>
        <button class="tombol" type="submit" style="margin-top:18px">Buat Akun eLOLA →</button>
      </form>
    </section>
  </main>
<!-- CDN Supabase Resmi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Script Aplikasi -->
  <script src="/js/utils.js"></script>
  <script src="/js/seed-init.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
