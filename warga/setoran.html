<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>eLOLA – Setor Sampah</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="kartu lebar">
    <section class="kiri">
      <div class="bar-atas">
        <button class="keluar-btn" onclick="keluarAkun()">Keluar</button>
      </div>
      <div class="atas">
        <div class="logo">
          <svg viewBox="0 0 42 42">
            <rect width="42" height="42" rx="11" fill="#58b45d"/>
            <path d="M21 9c-6 5-8 10-8 14a8 8 0 0 0 16 0c0-4-2-9-8-14z" fill="#fff"/>
            <path d="M21 14v17" stroke="#58b45d" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <div><b>eLOLA</b><small>Bank Sampah Digital</small></div>
        </div>
        <nav class="menu">
          <a href="/warga/setoran.html" class="aktif">Setor Sampah</a>
          <a href="/warga/dompet.html">Dompet & Hadiah</a>
          <a href="/peringkat.html">Klasemen RT</a>
        </nav>
      </div>
      <div>
        <h2 id="salam">Halo Warga</h2>
        <p class="peran-label" id="peranLabel"></p>
      </div>
    </section>

    <section class="kanan">
      <div class="kepala-halaman">
        <div>
          <h1>Formulir Setoran</h1>
          <p>Timbang sampah anorganikmu dan dapatkan poin tabungan.</p>
        </div>
      </div>

      <div id="notif" class="notif hidden"></div>

      <form id="fSetor">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
          <div>
            <label for="rw">RW</label>
            <select id="rw">
              <option>RW 01</option><option>RW 02</option><option>RW 03</option><option>RW 04</option><option>RW 05</option>
            </select>
          </div>
          <div>
            <label for="rt">RT</label>
            <select id="rt">
              <option>RT 01</option><option>RT 02</option><option>RT 03</option><option>RT 04</option>
            </select>
          </div>
        </div>

        <span class="judul-kecil">Pilih Jenis & Berat Sampah</span>
        <div id="daftarJenis"></div>

        <div class="estimasi">
          <div><small>Total Berat</small><b id="totKg">0 kg</b></div>
          <div><small>Estimasi Poin</small><b id="totPoin">0</b></div>
        </div>

        <button type="submit" class="tombol" id="bSetor" disabled>Kirim Setoran →</button>
      </form>

      <div style="margin-top:28px">
        <h3 style="font-family:var(--font-judul);margin-bottom:10px">Riwayat Setoran Saya</h3>
        <div class="tabel-bungkus">
          <table class="tabel">
            <thead>
              <tr><th>Waktu</th><th>Rincian</th><th>Berat</th><th>Poin</th><th>Status</th></tr>
            </thead>
            <tbody id="isiRiwayat"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- CDN Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/setoran.js"></script>
</body>
</html>
