<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eLOLA – Dompet Poin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="kartu lebar">
    <section class="kiri">
      <div class="bar-atas">
        <button class="keluar-btn" onclick="keluarAkun()">Keluar</button>
      </div>
      <div class="atas">
        <div class="logo">
          <svg viewBox="0 0 42 42">
            <rect width="42" height="42" rx="11" fill="#58b45d"/>
            <path d="M21 9c-6 5-8 10-8 14a8 8 0 0 0 16 0c0-4-2-9-8-14z" fill="#fff"/>
            <path d="M21 14v17" stroke="#58b45d" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <div><b>eLOLA</b><small>Bank Sampah Digital</small></div>
        </div>
        <nav class="menu">
          <a href="/warga/setoran.html">Setor Sampah</a>
          <a href="/warga/dompet.html" class="aktif">Dompet & Hadiah</a>
          <a href="/peringkat.html">Klasemen RT</a>
        </nav>
      </div>
      <div>
        <h2 id="salam">Halo Warga</h2>
        <p class="peran-label" id="peranLabel"></p>
      </div>
    </section>

    <section class="kanan">
      <div class="kepala-halaman">
        <div>
          <h1>Dompet & Hadiah</h1>
          <p>Tukar saldo poin setoran Anda dengan berbagai sembako atau voucher.</p>
        </div>
      </div>

      <div id="notif" class="notif hidden"></div>

      <div class="saldo">
        <div><b id="saldo">0</b><span>Poin Tersedia</span></div>
        <div><b id="rupiah">Rp 0</b><span>Setara Nilai Rupiah</span></div>
        <div><b id="kgTotal">0 kg</b><span>Total Sampah Disetor</span></div>
      </div>

      <h3 style="font-family:var(--font-judul);margin-bottom:12px">Katalog Penukaran</h3>
      <div class="katalog" id="katalog"></div>

      <div style="margin-top:28px">
        <h3 style="font-family:var(--font-judul);margin-bottom:10px">Riwayat Penukaran Hadiah</h3>
        <div class="tabel-bungkus">
          <table class="tabel">
            <thead>
              <tr><th>Waktu</th><th>Hadiah</th><th>Poin Dipotong</th></tr>
            </thead>
            <tbody id="isiTukar"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/dompet.js"></script>
</body>
</html>
