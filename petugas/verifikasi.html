<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>eLOLA – Verifikasi Petugas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="kartu lebar">
    <section class="kiri">
      <div class="bar-atas">
        <button class="keluar-btn" type="button" onclick="window.keluarAkun ? window.keluarAkun() : location.replace('/index.html')">Keluar</button>
      </div>
      <div class="atas">
        <div class="logo">
          <svg viewBox="0 0 42 42">
            <rect width="42" height="42" rx="11" fill="#58b45d"/>
            <path d="M21 9c-6 5-8 10-8 14a8 8 0 0 0 16 0c0-4-2-9-8-14z" fill="#fff"/>
            <path d="M21 14v17" stroke="#58b45d" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <div><b>eLOLA</b><small>Bank Sampah Digital</small></div>
        </div>
        <nav class="menu">
          <a href="/petugas/verifikasi.html" class="aktif">Verifikasi Antrean</a>
          <a href="/peringkat.html">Klasemen RT</a>
        </nav>
      </div>
      <div>
        <h2 id="salam">Halo Petugas</h2>
        <p class="peran-label" id="peranLabel"></p>
      </div>
    </section>

    <section class="kanan">
      <div class="kepala-halaman">
        <div>
          <h1>Antrean Verifikasi Setoran</h1>
          <p>Cocokkan timbangan lapangan dengan data klaim setoran sebelum disetujui.</p>
        </div>
      </div>

      <div id="notif" class="notif hidden"></div>
      <div id="antrean"></div>
    </section>
  </main>

  <!-- CDN Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth-guard.js"></script>

  <!-- Script Verifikasi dengan Realtime Supabase -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const user = await window.AuthGuard(["petugas", "admin"]);
      if (!user) return;

      const { $, notif, tglJam } = window.Utils;

      async function muatAntrean() {
        try {
          const list = (await window.SupabaseDB.getSetoran()).filter(s => s.status === "menunggu");
          const wadah = $("antrean");
          if (!wadah) return;

          if (!list.length) {
            wadah.innerHTML = "<p style='color:var(--abu)'>Tidak ada antrean setoran saat ini.</p>";
            return;
          }

          wadah.innerHTML = list.map(s => {
            const namaPenyetor = s.profiles ? s.profiles.nama : "Warga (ID: " + s.user_id.substring(0, 6) + "...)";
            const rincianStr = Object.entries(s.rincian || {}).map(([k, v]) => `${k}: ${v}kg`).join(", ");
            const fotoHtml = s.foto_url ? `<div style="margin:8px 0;"><a href="${s.foto_url}" target="_blank" style="color:var(--hijau-tua);font-weight:600;text-decoration:underline;">Lihat Foto Bukti Sampah</a></div>` : "";
            
            return `
              <div class="setoran-kartu" id="antrean-item-${s.id}">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <b>${namaPenyetor}</b>
                  <span style="font-weight:600;color:var(--hijau-tua);">${s.rw} / ${s.rt}</span>
                </div>
                <small style="color:var(--abu);">${tglJam(s.created_at)}</small>
                <p style="margin:8px 0;font-weight:600;">Rincian: ${rincianStr} (Total: ${s.kg} kg | ${s.poin} Poin)</p>
                ${fotoHtml}
                <div style="display:flex;gap:8px;margin-top:12px;">
                  <button class="tombol-kecil utama" onclick="verif(${s.id}, 'setujui')">Setujui</button>
                  <button class="tombol-kecil bahaya" onclick="verif(${s.id}, 'tolak')">Tolak</button>
                </div>
              </div>
            `;
          }).join("");
        } catch (err) {
          console.error(err);
          notif("err", err.message);
        }
      }

      window.verif = async (id, aksi) => {
        try {
          await window.SupabaseDB.verifikasiSetoran(id, {
            aksi,
            namaPetugas: user.nama || user.email,
            alasan: aksi === "tolak" ? "Tidak memenuhi kriteria pilah sampah." : ""
          });
          notif("ok", `Setoran #${id} berhasil di-${aksi}`);
          muatAntrean();
        } catch (e) {
          notif("err", e.message);
        }
      };

      // Muat data awal
      await muatAntrean();

      // Aktifkan Realtime Listener dari Supabase
      const sb = window.SupabaseDB.getClient();
      if (sb) {
        sb.channel('public:setoran')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'setoran' }, payload => {
            console.log('Perubahan data terdeteksi secara real-time:', payload);
            muatAntrean();
          })
          .subscribe();
      }
    });
  </script>
</body>
</html>
